<main class="app-container">
  <div class="content-layout">
    <app-controles (transformacion)="procesarTransformacion($event)" />

    <app-figura 
      [x]="posX" 
      [y]="posY" 
      [rotacion]="rotacionDeg" 
      [escala]="escalaFactor"
      [espejoX]="espejoX"
      [espejoY]="espejoY"
      [color]="colorFigura"
    />
    
  </div>
</main>
