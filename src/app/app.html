<main class="app-container">
  <div class="content-layout">
    

    <app-figura 
      [x]="posX" 
      [y]="posY" 
      [rotacion]="rotacionDeg" 
      [escala]="escalaFactor"
      [espejoX]="espejoX"
      [espejoY]="espejoY"
      [color]="colorFigura"
    />
    <app-controles (transformacion)="procesarTransformacion($event)" />
  </div>
</main>
