<main class="app-container">
  <h1>Transformador de Figuras Geométricas</h1>
  
  <div class="content-layout">
    <app-controles (transformacion)="procesarTransformacion($event)" />

    <app-figura 
      [x]="posX" 
      [y]="posY" 
      [rotacion]="rotacionDeg" 
      [escala]="escalaFactor" 
    />
  </div>
</main>
